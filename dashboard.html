<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <title>Admin Dashboard - Biro Jasa STNK Xavier</title>
  </head>
  <body class="bg-light d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
      <div class="container">
        <a
          href="home.html"
          class="navbar-brand d-flex align-items-center gap-2"
        >
          <img src="./asset/logo.png" alt="Logo" width="40" height="40" />
          <span class="fw-bold">ADMIN PANEL</span>
        </a>
        <a
          href="home.html"
          class="btn btn-outline-danger btn-sm rounded-pill px-3"
        >
          <i class="fa-solid fa-right-from-bracket me-1"></i> Logout
        </a>
      </div>
    </nav>

    <main class="container my-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2 class="fw-bold mb-0">Dashboard Kelola Data</h2>
          <p class="text-muted small">Monitoring data</p>
        </div>
      </div>

      <!-- Tab NAVIGASI -->
      <ul class="nav nav-tabs mb-4" id="adminTabs" role="tablist">
        <li class="nav-item">
          <button
            class="nav-link active fw-bold"
            id="pesan-tab"
            data-bs-toggle="tab"
            data-bs-target="#pesan-pane"
            type="button"
          >
            <i class="fa-solid fa-inbox me-2"></i>Pesan Masuk
          </button>
        </li>
        <li class="nav-item">
          <button
            class="nav-link fw-bold"
            id="users-tab"
            data-bs-toggle="tab"
            data-bs-target="#users-pane"
            type="button"
          >
            <i class="fa-solid fa-users me-2"></i>Kelola User
          </button>
        </li>
      </ul>

      <div class="tab-content">
        <!-- TAB PESAN -->
        <div class="tab-pane fade show active" id="pesan-pane">
          <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th>ID</th>
                    <th>Nama</th>
                    <th>Kontak</th>
                    <th>Pesan</th>
                    <th>Status</th>
                    <th class="text-center">Aksi</th>
                  </tr>
                </thead>
                <tbody id="tabel-pesan"></tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- TAB USER -->
        <div class="tab-pane fade" id="users-pane">
          <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div
              class="card-header bg-white py-3 d-flex justify-content-between align-items-center"
            >
              <h5 class="fw-bold mb-0">Daftar Pengguna</h5>
              <button
                class="btn btn-primary btn-sm rounded-pill px-3"
                data-bs-toggle="modal"
                data-bs-target="#addUserModal"
              >
                <i class="fa-solid fa-user-plus me-1"></i> Tambah User
              </button>
            </div>
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th>ID</th>
                    <th>Nama</th>
                    <th>No. WhatsApp</th>
                    <th>Email</th>
                    <th class="text-center">Aksi</th>
                  </tr>
                </thead>
                <tbody id="tabel-users"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>

    <!-- Modal Tambah User -->
    <div class="modal fade" id="addUserModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content rounded-4">
          <div class="modal-header">
            <h5 class="modal-title fw-bold">Tambah User Baru</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <form id="form-add-user" onsubmit="handleAddUser(event)">
            <div class="modal-body">
              <div class="mb-3">
                <label class="small fw-semibold">Nama Lengkap</label
                ><input
                  type="text"
                  id="add-nama"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="small fw-semibold">No. WhatsApp</label
                ><input
                  type="tel"
                  id="add-phone"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="small fw-semibold">Email</label
                ><input
                  type="email"
                  id="add-email"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="small fw-semibold">Kata Sandi</label
                ><input
                  type="password"
                  id="add-password"
                  class="form-control"
                  required
                />
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary rounded-pill"
                data-bs-dismiss="modal"
              >
                Batal
              </button>
              <button type="submit" class="btn btn-primary rounded-pill">
                Simpan
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Modal Edit User -->
    <div class="modal fade" id="editUserModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content rounded-4">
          <div class="modal-header">
            <h5 class="modal-title fw-bold">Edit User</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <form id="form-edit-user" onsubmit="handleEditUser(event)">
            <div class="modal-body">
              <input type="hidden" id="edit-id" />
              <div class="mb-3">
                <label class="small fw-semibold">Nama Lengkap</label
                ><input
                  type="text"
                  id="edit-nama"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="small fw-semibold">No. WhatsApp</label
                ><input
                  type="tel"
                  id="edit-phone"
                  class="form-control"
                  required
                />
              </div>
              <div class="mb-3">
                <label class="small fw-semibold">Email</label
                ><input
                  type="email"
                  id="edit-email"
                  class="form-control"
                  required
                />
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary rounded-pill"
                data-bs-dismiss="modal"
              >
                Batal
              </button>
              <button type="submit" class="btn btn-primary rounded-pill">
                Update
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // tampil data pesan
      async function loadPesan() {
        const res = await fetch("/api/pesan");
        const data = await res.json();
        const tbody = document.getElementById("tabel-pesan");
        tbody.innerHTML = "";
        data.forEach((item) => {
          tbody.innerHTML += `
            <tr class="${item.status === "unread" ? "fw-bold bg-light" : ""}">
              <td>${item.id}</td>
              <td>${item.nama}</td>
              <td>${item.kontak}</td>
              <td>${item.pesan}</td>
              <td><span class="badge ${item.status === "read" ? "bg-success" : "bg-warning text-dark"}">${item.status}</span></td>
              <td class="text-center">
                ${item.status === "unread" ? `<button class="btn btn-sm btn-outline-success me-1" onclick="markRead(${item.id})"><i class="fa-solid fa-check"></i></button>` : ""}
                <button class="btn btn-sm btn-outline-danger" onclick="deletePesan(${item.id})"><i class="fa-solid fa-trash"></i></button>
              </td>
            </tr>`;
        });
      }

      // Tampil data user
      async function loadUsers() {
        const res = await fetch("/api/users");
        const data = await res.json();
        const tbody = document.getElementById("tabel-users");
        tbody.innerHTML = "";
        data.forEach((item) => {
          tbody.innerHTML += `
            <tr>
              <td>${item.id}</td>
              <td>${item.nama}</td>
              <td>${item.phone}</td>
              <td>${item.email}</td>
              <td class="text-center">
                <button class="btn btn-sm btn-outline-primary me-1" onclick="openEditUser(${item.id}, '${item.nama}', '${item.phone}', '${item.email}')"><i class="fa-solid fa-pen"></i></button>
                <button class="btn btn-sm btn-outline-danger" onclick="deleteUser(${item.id})"><i class="fa-solid fa-trash"></i></button>
              </td>
            </tr>`;
        });
      }

      // Pesan
      async function markRead(id) {
        await fetch(`/api/pesan/${id}/read`, { method: "PUT" });
        loadPesan();
      }

      async function deletePesan(id) {
        if (confirm("Hapus pesan ini?")) {
          await fetch(`/api/pesan/${id}`, { method: "DELETE" });
          loadPesan();
        }
      }

      // User
      async function handleAddUser(e) {
        e.preventDefault();
        const body = {
          nama: document.getElementById("add-nama").value,
          phone: document.getElementById("add-phone").value,
          email: document.getElementById("add-email").value,
          password: document.getElementById("add-password").value,
        };
        await fetch("/api/users", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        bootstrap.Modal.getInstance(
          document.getElementById("addUserModal"),
        ).hide();
        e.target.reset();
        loadUsers();
      }

      function openEditUser(id, nama, phone, email) {
        document.getElementById("edit-id").value = id;
        document.getElementById("edit-nama").value = nama;
        document.getElementById("edit-phone").value = phone;
        document.getElementById("edit-email").value = email;
        new bootstrap.Modal(document.getElementById("editUserModal")).show();
      }

      async function handleEditUser(e) {
        e.preventDefault();
        const id = document.getElementById("edit-id").value;
        const body = {
          nama: document.getElementById("edit-nama").value,
          phone: document.getElementById("edit-phone").value,
          email: document.getElementById("edit-email").value,
        };
        await fetch(`/api/users/${id}`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        bootstrap.Modal.getInstance(
          document.getElementById("editUserModal"),
        ).hide();
        loadUsers();
      }

      async function deleteUser(id) {
        if (confirm("Hapus user ini?")) {
          await fetch(`/api/users/${id}`, { method: "DELETE" });
          loadUsers();
        }
      }

      // Init Load
      document.addEventListener("DOMContentLoaded", () => {
        loadPesan();
        loadUsers();
      });
    </script>
  </body>
</html>
